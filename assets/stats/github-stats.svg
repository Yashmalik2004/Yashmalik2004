      font-size="14"
      font-weight="700"
      fill="url(#title-grad)"
      letter-spacing="0.5">GitHub Contribution Stats</text>
  </g>
  
  <g class="fi-2">
    <!-- Pillar background -->
    <rect x="24" y="56" width="212" height="80" rx="10"
