    <!-- Logo dots (decorative) -->
    <circle cx="29" cy="36" r="4" fill="#ff9e64" opacity="0.9"/>
    <circle cx="41" cy="36" r="4" fill="#9ece6a" opacity="0.9"/>
    <circle cx="53" cy="36" r="4" fill="#7dcfff" opacity="0.9"/>

