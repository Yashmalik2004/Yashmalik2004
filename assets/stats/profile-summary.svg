<svg xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="900" height="400" viewBox="0 0 900 400"
  role="img" aria-label="GitHub Profile Summary Card">

  <title>GitHub Profile Summary — @Yashmalik2004</title>
  <desc>
    4 stars, 504 commits,
    47 PRs, 1 issues,
    29 repositories.
